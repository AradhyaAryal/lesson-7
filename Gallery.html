<html>
    <head>
        <title>Navbar</title>
        <style>
            body {
                margin: 0;
                font-family: Arial, Helvetica, sans-serif;
            }

            .topnav{
                overflow: hidden;
                background-color: #333;
            }
            .topnav a{
                float: left;
                color: #1affa3;
                text-align: center;
                padding: 14px, 25px;
                text-decoration: none;
                font-size: 30px;
            }

            .topnav a:hover{
                background-color: #ddd; 
                color: rgb(0, 0, 0);
            }

            .topnav a:active{
                background-color: #ffe066;
                color: black;
            }
        </style>
    </head>
    <body>
        <div class="topnav">
            <a href="index.html">Home</a>
            <a href="About.html">About_Us</a>
            <a href="Contact.html">Contact_Us</a>
            <a class="active" href="Gallery.html">Gallery</a>
        </div>
          <h1>Gallery</h1>
    </body>
</html>
