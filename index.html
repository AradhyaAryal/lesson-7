<html>
    <head>
        <title>Navbar</title>
        <style>
            body {
                margin: 0;
                font-family: Arial, Helvetica, sans-serif;
            }

            .topnav{
                overflow: hidden;
                background-color: #333;
            }
            .topnav a{
                float: left;
                color: #1affa3;
                text-align: center;
                padding: 14px, 16px;
                text-decoration: none;
                font-size: 17px;
            }

            .topnav a:hover{
                background-color: #ddd; 
                color: black;
            }

            .topnav a:active{
                background-color: #ffe066;
                color: black;
            }
        </style>
    </head>
    <body>
        <div class="topnav">
            <a class="active" href="index.html">Home</a>
            <a href="About.html">About_Us</a>
            <a href="Contact.html">Contact_Us</a>
            <a href="Gallery.html">Gallery</a>
        </div>
        <center>
            <h1>
                Home
            </h1>
        <section>
            <img class="mySlides" src="R (1).jpg" style="Height:500px;">
            <img class="mySlides" src="OIP.webp" style="Height:500px;">
           <img class="mySlides" src="R.jpg" style="Height:500px;">
        </section>
        </center>
        <script>
            var myIndex = 0;
            carousel()

            function carousel(){
                var i;
                var x = document.getElementsByClassName("mySlides");
                for (i= 0; i < x.length; i++){
                    x[i].style.display = "none";
                }

                myIndex++;
                if (myIndex > x.length) {myIndex = 1}
                x[myIndex-1].style.display = "block";
                setTimeout(carousel, 3000);
            }
            </script>
          
    </body>
</html>
